name: CI
on:
  push:
  pull_request:
env:
  SCHEMEAI_RETRIEVAL_MODE: lexical
  SCHEMEAI_EVAL_RETRIEVAL_MODE: lexical
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Evaluation report (non-blocking baseline)
        continue-on-error: true
        run: python scripts/evaluate.py --retrieval-mode lexical
